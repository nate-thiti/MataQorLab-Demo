name: Staging critical-path E2E

on:
  workflow_dispatch:
  workflow_call:

jobs:
  staging-e2e:
    if: vars.RUN_STAGING_E2E == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      STAGING_APP_URL: ${{ vars.STAGING_APP_URL }}
      STAGING_API_URL: ${{ vars.STAGING_API_URL }}
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_TEST_USER_EMAIL: ${{ secrets.STAGING_TEST_USER_EMAIL }}
      STAGING_TEST_USER_PASSWORD: ${{ secrets.STAGING_TEST_USER_PASSWORD }}
      PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
      PRODUCTION_API_URL: ${{ vars.PRODUCTION_API_URL }}
      PRODUCTION_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
      PRODUCTION_SUPABASE_PROJECT_REF: ${{ vars.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify staging isolation
        run: node scripts/assert-staging-isolation.mjs
      - name: Run real-stack staging tests
        run: npx playwright test --config=playwright.staging.config.ts
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staging-playwright-report
          path: |
            playwright-report-staging
            test-results
          retention-days: 14

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: python -m app.worker
    restart: unless-stopped
    depends_on:
      - backend

  web:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    env_file:
      - ./.env.local
    volumes:
      - .:/app
      - /app/node_modules
      # Keep Docker's dev cache isolated from host files and production `.next`.
      - /app/.next-local
    stdin_open: true
    tty: true
    # The node_modules volume survives image rebuilds. Sync it with the current
    # lockfile before starting Next.js so newly added packages are available.
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
